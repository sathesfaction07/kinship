name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=case_search --cov-report=term-missing

      - name: Doctor runs with no credentials and no network
        run: kinship doctor -i data/cases.jsonl -k data/truth.jsonl

      - name: Every truth key names a case that exists
        run: |
          python - <<'PY'
          from pathlib import Path
          from case_search.dedupe import dedupe
          from case_search.sources import load_cases, load_truth
          rows, problems = load_cases(Path("data/cases.jsonl"))
          assert not problems, problems
          kept, _ = dedupe(rows)
          truth = load_truth(Path("data/truth.jsonl"))
          orphans = sorted(set(truth) - {c.key for c in kept})
          assert not orphans, f"{len(orphans)} orphan truth key(s): {orphans[:3]}"
          print(len(kept), "cases,", len(truth), "truth keys")
          PY

      - name: Normalisation needs NFKC and casefold, not lower()
        run: |
          python - <<'PY'
          from case_search.normalise import canonical, fold
          # Fullwidth needs NFKC.
          assert fold("\uff21\uff23\uff2d\uff25 Corp") == "acme corp"
          # The sharp s needs casefold; lower() leaves it alone.
          assert "Wei\u00dfbr\u00e4u".lower() == "wei\u00dfbr\u00e4u"
          assert fold("Wei\u00dfbr\u00e4u") == fold("Weissbr\u00e4u") == "weissbr\u00e4u"
          # A non-breaking space needs NFKC.
          assert fold("ACME\u00a0Corp") == "acme corp"
          # Visually identical, different LENGTHS -- so any edit distance on the raw strings
          # reports a difference a human cannot see.
          a, b = "Cafe\u0301 Noir", "Caf\u00e9 Noir"
          assert (len(a), len(b)) == (10, 9)
          assert a.casefold() != b.casefold()
          assert fold(a) == fold(b)
          # Canonicalisation is an equivalence relation.
          assert len({canonical(n) for n in ["ACME Corp", "acme, inc.", "The ACME Ltd"]}) == 1
          print("normalisation holds")
          PY

      - name: Similarity is symmetric but NOT transitive
        run: |
          python - <<'PY'
          from itertools import pairwise
          from case_search.similarity import similarity
          T = 0.85
          chain = ["Northwind Trading", "Northwund Trading", "Northwund Troding",
                   "Norihwund Troding", "Norihwuad Troding"]
          for a, b in pairwise(chain):
              assert similarity(a, b) >= T, (a, b)
              assert similarity(a, b) == similarity(b, a)
          ends = similarity(chain[0], chain[-1])
          assert ends < T, ends
          print(f"every link >= {T}, ends at {ends:.3f} -- not an equivalence relation")
          PY

      - name: Every linkage rule is order-independent
        # Complete linkage was NOT until the merge choice became deterministic: taking the
        # first qualifying merge gave three different partitions across six shuffles.
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          from case_search.cluster import resolve
          from case_search.dedupe import dedupe
          from case_search.models import Linkage
          from case_search.sources import load_cases
          rows, _ = load_cases(Path("data/cases.jsonl"))
          kept, _ = dedupe(rows)
          for linkage in Linkage:
              seen = set()
              for seed in range(6):
                  shuffled = list(kept)
                  random.Random(seed).shuffle(shuffled)
                  entities, _, _ = resolve(shuffled, threshold=0.85, linkage=linkage)
                  seen.add(tuple(sorted(tuple(e.members) for e in entities)))
              assert len(seen) == 1, f"{linkage} is order-dependent"
              print(linkage.value, "stable")
          PY

      - name: Only single linkage chains, and one chain causes all its false pairs
        run: |
          python - <<'PY'
          from pathlib import Path
          from case_search.cluster import chained_entities, resolve
          from case_search.dedupe import dedupe
          from case_search.measure import pairwise
          from case_search.models import Linkage
          from case_search.sources import load_cases, load_truth
          T = 0.85
          rows, _ = load_cases(Path("data/cases.jsonl"))
          kept, _ = dedupe(rows)
          truth = load_truth(Path("data/truth.jsonl"))

          entities, _, _ = resolve(kept, threshold=T, linkage=Linkage.SINGLE)
          chained = chained_entities(entities, T)
          assert len(chained) == 1 and chained[0].size == 5, chained
          members = sorted(chained[0].members)
          wrong = sum(
              1
              for i, a in enumerate(members)
              for b in members[i + 1:]
              if truth.get(a) != truth.get(b)
          )
          score = pairwise(entities, truth)
          assert wrong == score.false_positives == 6, (wrong, score.false_positives)

          for linkage in (Linkage.COMPLETE, Linkage.CANONICAL):
              other, _, _ = resolve(kept, threshold=T, linkage=linkage)
              assert chained_entities(other, T) == []
          print("all 6 false pairs come from the one chain; stricter rules never chain")
          PY

      - name: Blocking sets a measurable ceiling on recall
        run: |
          python - <<'PY'
          from pathlib import Path
          from case_search.block import combined_key, pair_completeness, prefix_key, token_key
          from case_search.dedupe import dedupe
          from case_search.sources import load_cases, load_truth
          rows, _ = load_cases(Path("data/cases.jsonl"))
          kept, _ = dedupe(rows)
          truth = load_truth(Path("data/truth.jsonl"))
          scores = {
              name: pair_completeness(kept, truth, key=key)
              for name, key in [("prefix", prefix_key), ("token", token_key),
                                ("combined", combined_key)]
          }
          assert scores["prefix"][0] < scores["combined"][0] < 1.0
          assert scores["token"][0] < scores["combined"][0]
          names = {c.key: c.merchant_name for c in kept}
          lost = scores["combined"][1]
          assert len(lost) == 1
          assert sorted(names[k] for k in lost[0]) == ["Nordwind AB", "Norwind AB"]
          for name, (score, missed) in scores.items():
              print(f"{name}: {score:.1%} ({len(missed)} lost)")
          PY

      - name: resolve gates on the gap but reports the unknown
        run: |
          ! kinship resolve -i data/cases.jsonl
          kinship resolve -i data/cases.jsonl | grep -q 'gap_in_pages'
          kinship resolve -i data/cases.jsonl | grep -q 'CANNOT be determined'
          kinship resolve -i data/cases.jsonl | grep -q 'CHAINED'
          kinship resolve -i data/cases.jsonl -l complete | grep -qv 'CHAINED' || true
          echo "gated on the gap, reported the unknown, flagged the chain"

      - name: compare produces the documented figures
        run: |
          kinship compare -i data/cases.jsonl -k data/truth.jsonl -o /tmp/cmp
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/cmp/comparison.json"))
          rules = {r["linkage"]: r for r in payload["rules"]}
          assert payload["truth_keys"] == 53, payload["truth_keys"]
          assert all(r["order_stable"] is True for r in rules.values())
          assert rules["single"]["chained"] == 1
          assert rules["complete"]["chained"] == 0
          assert rules["canonical"]["chained"] == 0
          assert rules["canonical"]["pairwise"]["precision"] == 1.0
          assert rules["canonical"]["pairwise"]["recall"] < 0.4
          assert payload["blocking"]["pair_completeness"] < 1.0
          assert len(payload["blocking"]["lost_pairs"]) == 1
          # The rule with the best cluster F1 is the ONLY one that chains, so no rule
          # dominates -- which is why all three are reported.
          best = max(rules.values(), key=lambda r: r["cluster"]["f1"])
          assert best["linkage"] == "single" and best["chained"] == 1
          print("preferred:", payload["preferred"])
          PY

  test-windows:
    # The Linux job runs the full suite plus this project's own checks. This job runs the
    # test suite on Windows, where the default encoding is cp1252 and paths use backslashes:
    # several projects in this portfolio shipped bugs that only failed there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
