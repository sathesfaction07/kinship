[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "case-search"
version = "0.1.0"
description = "Cross-region case deduplication with measured fuzzy entity resolution"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
case-search = "case_search.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/case_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
